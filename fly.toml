# fly.toml app configuration file generated for agentcheck-demo on 2026-09-18T10:47:52+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agentcheck-demo'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  AGENTCHECK_DEMO = '1'
  AGENTCHECK_HOME = '/data'

[http_service]
  internal_port = 7373
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 60
    soft_limit = 40

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
