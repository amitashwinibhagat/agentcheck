# AgentCheck on a single GCP e2-micro (Always Free)
#
#   cd deploy/gcp
#   cp .env.example .env      # then edit
#   docker compose up -d --build
#
# Two containers: the app, and Caddy in front for TLS. The app is not
# published on a host port — only Caddy is, so the app is never reachable
# over plaintext HTTP from outside.

# Shared service shape. Both app instances build the same image and agree on
# everything except posture (demo flag, billing) and storage. If a line needs
# to differ between demo and prod, it lives on the service, not here — that
# is what keeps the billing-absent guarantee reviewable.
x-app: &app
  build:
    context: ../..
    dockerfile: Dockerfile
  image: agentcheck:gcp
  restart: unless-stopped
  expose:
    - "7373"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-app-env: &app-env
  AGENTCHECK_HOME: /data
  # Judge. Omit the key to fall back to the offline stub judge.
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  TYPESAFE_DEFAULT_MODEL: ${TYPESAFE_DEFAULT_MODEL:-jev-latest}
  AGENTCHECK_JUDGE_RETRIES: ${AGENTCHECK_JUDGE_RETRIES:-3}
  # Set these together to turn on sign-in (see README, "Sign-in").
  AGENTCHECK_AUTH: ${AGENTCHECK_AUTH:-}
  AGENTCHECK_SECRET: ${AGENTCHECK_SECRET:-}
  AGENTCHECK_BASE_URL: ${AGENTCHECK_BASE_URL:-}
  WORKOS_CLIENT_ID: ${WORKOS_CLIENT_ID:-}
  WORKOS_API_KEY: ${WORKOS_API_KEY:-}
  # Postgres instead of SQLite: postgresql://user:pw@host/db
  AGENTCHECK_DB_URL: ${AGENTCHECK_DB_URL:-}

services:
  agentcheck:
    <<: *app
    environment:
      <<: *app-env
      # Default 0: a public host must not hand out a key. AGENTCHECK_DEMO=1 is
      # for a throwaway prospect box you control, never for the marketing URL.
      # /start is the public page; `/` is the product and requires a key or a
      # session. Billing stays absent here either way.
      AGENTCHECK_DEMO: ${AGENTCHECK_DEMO:-0}
    volumes:
      # Named volume on the VM's persistent disk. Without this, every
      # rebuild starts from an empty database — the mistake we made on Fly.
      - agentcheck-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7373/v1/bootstrap',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    expose:
      - "7373"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── the non-demo instance ──────────────────────────────────────────────
  # Same image, opposite posture: AGENTCHECK_DEMO=0, so /v1/bootstrap is
  # localhost-only and no key is handed to the public. This is the instance
  # billing may be armed on: the demo's key is public, so pointing checkout at
  # the demo would let anyone create live subscriptions on this account.
  agentcheck-prod:
    <<: *app
    environment:
      <<: *app-env
      # Not a demo. Customers get keys issued, not handed out.
      AGENTCHECK_DEMO: "0"
      AGENTCHECK_BILLING: ${AGENTCHECK_BILLING:-}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      RAZORPAY_PLAN_ID_PRO: ${RAZORPAY_PLAN_ID_PRO:-}
      RAZORPAY_PLAN_ID_TEAM: ${RAZORPAY_PLAN_ID_TEAM:-}
    volumes:
      - agentcheck-prod-data:/data
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:7373/',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - agentcheck
      - agentcheck-prod
    ports:
      - "80:80"
      - "443:443"
    environment:
      # The hostname Caddy serves and gets a certificate for. The demo.
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      # The non-demo instance. Optional: defaults to a localhost-only site so
      # a single-instance deployment still parses. See Caddyfile.
      SITE_ADDRESS_PROD: ${SITE_ADDRESS_PROD:-localhost:9999}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      # The wheel we publish until PyPI is unblocked. Actions is currently
      # dead on this account (billing), so this is the distribution path that
      # works today; drop the file in and it is installable by URL.
      - agentcheck-dist:/srv/dist:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  agentcheck-data:
  agentcheck-prod-data:
  caddy-data:
  caddy-config:
  agentcheck-dist:
